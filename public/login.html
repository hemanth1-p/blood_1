<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – BloodConnect</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-pattern">
  <div class="page-loader"><div class="loader-drop">🩸</div></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo"><span class="logo-icon">🩸</span> BloodConnect</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/find-donors.html">Find Donors</a>
        <a href="/emergency.html">Emergency</a>
        <a href="/register.html">Register</a>
        <a href="/login.html" class="active">Login</a>
      </div>
      <div class="nav-actions">
        <a href="/register.html" class="btn btn-primary btn-sm">Become a Donor ❤️</a>
      </div>
      <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
    <div class="mobile-menu">
      <a href="/">Home</a>
      <a href="/find-donors.html">Find Donors</a>
      <a href="/emergency.html">Emergency</a>
      <a href="/register.html">Register</a>
      <a href="/login.html">Login</a>
      <div class="auth-links"></div>
    </div>
  </nav>

  <div class="form-page">
    <div class="container">
      <div class="form-card">
        <div class="form-header">
          <div class="form-icon">🩸</div>
          <h1>Welcome Back</h1>
          <p>Sign in to your BloodConnect account</p>
        </div>

        <div class="login-tabs">
          <button type="button" class="login-tab active" id="donorTab" data-role="donor">❤️ Donor Login</button>
          <button type="button" class="login-tab" id="adminTab" data-role="admin">🛡️ Admin Portal</button>
        </div>

        <div id="login-alert" class="alert"></div>

        <form id="loginForm">
          <div style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg btn-block" style="margin-top: 0.5rem;">
              Sign In
            </button>
          </div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--gray-200);">
          <p style="color: var(--gray-600);">New to BloodConnect? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Register as a donor</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
