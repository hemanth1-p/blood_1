<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register as a Donor – BloodConnect</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-pattern">
  <div class="page-loader"><div class="loader-drop">🩸</div></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo"><span class="logo-icon">🩸</span> BloodConnect</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/find-donors.html">Find Donors</a>
        <a href="/emergency.html">Emergency</a>
        <a href="/register.html" class="active">Register</a>
        <a href="/login.html">Login</a>
      </div>
      <div class="nav-actions">
        <a href="/login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
      <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
    <div class="mobile-menu">
      <a href="/">Home</a>
      <a href="/find-donors.html">Find Donors</a>
      <a href="/emergency.html">Emergency</a>
      <a href="/register.html">Register</a>
      <a href="/login.html">Login</a>
      <div class="auth-links"></div>
    </div>
  </nav>

  <div class="form-page">
    <div class="container">
      <div class="form-card form-card-wide">
        <div class="form-header">
          <div class="form-icon">❤️</div>
          <h1>Become a Blood Donor</h1>
          <p>Join thousands of life savers. Your single donation can save up to 3 lives.</p>
        </div>

        <div id="register-alert" class="alert"></div>

        <form id="registerForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="fullName">Full Name *</label>
              <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address *</label>
              <input type="email" id="email" name="email" placeholder="e.g. john@example.com" required>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input type="tel" id="phone" name="phone" placeholder="e.g. 9876543210" required>
            </div>

            <div class="form-group">
              <label for="bloodGroup">Blood Group *</label>
              <select id="bloodGroup" name="bloodGroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>

            <div class="form-group">
              <label for="dateOfBirth">Date of Birth * (Must be 18+)</label>
              <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>

            <div class="form-group">
              <label for="gender">Gender *</label>
              <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="location">City / Location *</label>
              <input type="text" id="location" name="location" placeholder="e.g. Hyderabad" required>
            </div>

            <div class="form-group">
              <label for="lastDonationDate">Last Donation Date (If applicable)</label>
              <input type="date" id="lastDonationDate" name="lastDonationDate">
            </div>

            <div class="form-group full-width">
              <label for="address">Full Address (Optional)</label>
              <input type="text" id="address" name="address" placeholder="Street, landmark, pincode...">
            </div>

            <div class="form-group">
              <label for="password">Password * (Min 6 chars)</label>
              <input type="password" id="password" name="password" minlength="6" placeholder="Create password" required>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password *</label>
              <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" placeholder="Re-enter password" required>
            </div>

            <div class="form-group full-width">
              <div class="toggle-group">
                <input type="checkbox" id="isAvailable" name="isAvailable" checked style="width: auto; cursor: pointer;">
                <label for="isAvailable" style="margin: 0; cursor: pointer;">
                  <strong>Available for emergency blood donation</strong> (You can toggle this status anytime in your dashboard)
                </label>
              </div>
            </div>

            <div class="form-group full-width" style="margin-top: 1rem;">
              <button type="submit" id="submitBtn" class="btn btn-primary btn-lg btn-block">
                ❤️ Register as Life Saver
              </button>
            </div>
          </div>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200);">
          <p style="color: var(--gray-600);">Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Sign in here</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
